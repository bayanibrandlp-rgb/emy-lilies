<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ASCII Lily Story — For Emy</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070a14;
      --fg: #f4ecd0;
      --muted: rgba(244, 236, 208, 0.58);
      --panel: rgba(11, 16, 30, 0.72);
      --border: rgba(244, 236, 208, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #0e162b 0%, var(--bg) 72%);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--muted);
      z-index: 3;
    }

    .badge {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    .hint {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 14px;
      right: 14px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
      z-index: 3;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="badge" id="sceneLabel">Scene 1 / 5 · Initial Bloom</div>
    <div class="badge" id="clockLabel">00:00 / 03:00</div>
  </div>
  <canvas id="c"></canvas>
  <div class="hint" id="hintText">Click anywhere to advance · ←/→ switch beats · Space pause</div>

  <script>
    (() => {
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const sceneLabel = document.getElementById("sceneLabel");
      const clockLabel = document.getElementById("clockLabel");
      const hintText = document.getElementById("hintText");

      const GLYPHS = ["@", "#", "&", "%", "$", "*", "+", "=", "~", ":", ".", "·", "♥", "♡"];

      const TEXT_HEALTH = [
        "In a lily's lifespan, there will be moments where the lily is not at its healthiest state.",
        "Our relationship is just the same. There will be times where we are not 100 percent, and that's alright."
      ];

      const TEXT_DROP = [
        "Just like this drop of water, even the slightest touch of your affection, your presence, or even your reassuring words",
        "could turn our bad mornings, grumpy midnight, or lousy misunderstandings into a clear, vibrant, and cheerful moment."
      ];

      const TEXT_FIELD = [
        "A field of lilies blooming under night hearts and fireflies,",
        "growing steady through every season — Sincerely yours, Brandow"
      ];

      // Beat definitions:
      // 0: Initial Bloom (bouquet blooms + welcome title)
      // 1: Vanish & Slow Decay + Health Message
      // 2: Water Drop Revival + Affection & Presence Message
      // 3: Field of Lilies + Hearts & Fireflies
      // 4: Quiet Finale / Replay Prompt
      const SCENES = [
        { name: "Initial Bloom", hint: "Click anywhere when ready for the next part →" },
        { name: "Decay & Health Reflection", hint: "Watch the slow wilt & reflection · Click for the water drop →" },
        { name: "Water Drop & Revival", hint: "A single drop brings warmth back · Click for the lily field →" },
        { name: "Field, Hearts & Fireflies", hint: "Full field blooming · Click for finale or replay" },
        { name: "Still Blooming", hint: "Click anywhere to replay from the start" }
      ];

      let width = 0;
      let height = 0;
      let dpr = 1;
      let cols = 120;
      let rows = 55;
      let cellW = 10;
      let cellH = 14;

      let sceneIndex = 0;
      let sceneStart = performance.now();
      let paused = false;
      let pauseAccum = 0;
      let pauseStartedAt = 0;
      let totalStart = performance.now();

      // Particle / effect states
      let dropAnim = {
        active: false,
        start: 0,
        targetX: 0.5,
        targetY: 0.62,
        impacted: false,
        impactTime: 0
      };

      const hearts = Array.from({ length: 24 }, (_, i) => ({
        x: Math.random(),
        y: Math.random(),
        speed: 0.018 + Math.random() * 0.024,
        drift: Math.random() * Math.PI * 2,
        amp: 0.01 + Math.random() * 0.025,
        phase: i * 0.7,
        char: i % 3 === 0 ? "♥" : "♡",
        color: i % 2 === 0 ? "rgba(255, 138, 178, 0.75)" : "rgba(255, 196, 216, 0.65)"
      }));

      const fireflies = Array.from({ length: 36 }, (_, i) => ({
        x: Math.random(),
        y: 0.15 + Math.random() * 0.72,
        vx: (Math.random() - 0.5) * 0.03,
        vy: (Math.random() - 0.5) * 0.02,
        phase: Math.random() * Math.PI * 2,
        freq: 1.5 + Math.random() * 2.5,
        glyph: i % 2 === 0 ? "✦" : "·"
      }));

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        cellH = Math.max(12, Math.min(16, Math.floor(height / 48)));
        cellW = Math.max(7, Math.floor(cellH * 0.62));
        cols = Math.max(40, Math.floor(width / cellW));
        rows = Math.max(20, Math.floor(height / cellH));
      }

      function setScene(idx) {
        sceneIndex = ((idx % SCENES.length) + SCENES.length) % SCENES.length;
        sceneStart = performance.now();
        if (sceneIndex === 0) {
          totalStart = performance.now();
          pauseAccum = 0;
        }
        if (sceneIndex === 2) {
          dropAnim = {
            active: true,
            start: performance.now(),
            targetX: 0.5,
            targetY: 0.58,
            impacted: false,
            impactTime: 0
          };
        } else {
          dropAnim.active = false;
        }
        sceneLabel.textContent = `Scene ${sceneIndex + 1} / ${SCENES.length} · ${SCENES[sceneIndex].name}`;
        hintText.textContent = SCENES[sceneIndex].hint;
      }

      function advanceScene() {
        if (sceneIndex >= SCENES.length - 1) {
          setScene(0);
        } else {
          setScene(sceneIndex + 1);
        }
      }

      function getVitality(sceneIdx, localSec, now) {
        // 0 = healthy/vibrant, -1 = decayed/wilted
        if (sceneIdx === 0) {
          return Math.min(1, localSec / 2.2);
        }
        if (sceneIdx === 1) {
          // Smoothly decays over ~9 seconds after entering Scene 1
          const decayProg = Math.min(1, localSec / 9.0);
          const eased = decayProg * decayProg * (3 - 2 * decayProg);
          return 1 - eased * 1.45; // down to -0.45 (wilted & muted)
        }
        if (sceneIdx === 2) {
          // Starts wilted, revives sharply once water drop hits (~1.1s)
          const impactDelay = 1.1;
          if (localSec < impactDelay) {
            return -0.45;
          }
          const reviveProg = Math.min(1, (localSec - impactDelay) / 2.6);
          const eased = 1 - Math.pow(1 - reviveProg, 3);
          return -0.45 + eased * 1.45;
        }
        if (sceneIdx === 3) {
          return 1.0 + 0.06 * Math.sin(now * 0.002);
        }
        return 0.85 + 0.08 * Math.sin(now * 0.0015);
      }

      function drawLilyHead(cx, cy, radius, openAmount, droop, vitality, hueShift, sway, glyphSeed) {
        const petalCount = 6;
        const wiltFactor = Math.max(0, -vitality);
        const bloomScale = Math.max(0.28, vitality > 0 ? 0.45 + 0.55 * openAmount : 0.72 - 0.25 * wiltFactor);

        // Stamen / center
        ctx.font = `${Math.max(10, Math.floor(cellH * 0.9))}px monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = vitality < 0 ? "rgba(180, 155, 95, 0.55)" : "#ffd966";
        ctx.fillText("✿", cx + sway * 0.5, cy + droop * 0.5);

        for (let p = 0; p < petalCount; p++) {
          const angle = (p / petalCount) * Math.PI * 2 + sway * 0.025;
          const spread = radius * bloomScale * (0.65 + 0.35 * openAmount);
          const px = cx + Math.cos(angle) * spread + sway;
          const py = cy + Math.sin(angle) * spread * 0.82 + droop + wiltFactor * 14;

          const glyphIdx = Math.abs(Math.floor(glyphSeed + p * 3 + openAmount * 5)) % GLYPHS.length;
          const ch = vitality < -0.15 && p % 2 === 0 ? "." : GLYPHS[glyphIdx];

          if (vitality < 0) {
            const g = Math.max(65, Math.floor(155 + vitality * 60));
            ctx.fillStyle = `rgba(${g + 20}, ${g}, ${Math.max(55, g - 25)}, ${Math.max(0.25, 0.72 + vitality * 0.4)})`;
          } else {
            const bright = Math.min(1, 0.55 + 0.45 * Math.max(0, vitality));
            ctx.fillStyle = (p + hueShift) % 2 === 0
              ? `rgba(255, 246, 224, ${bright})`
              : `rgba(255, 194, 214, ${bright})`;
          }

          ctx.fillText(ch, px, py);
        }
      }

      function drawStemAndLeaves(baseX, baseY, topX, topY, vitality, sway, phase) {
        const wiltSag = Math.max(0, -vitality) * 28;
        const midX = (baseX + topX) * 0.5 + sway * 0.6;
        const midY = (baseY + topY) * 0.5 + wiltSag * 0.5;
        const endX = topX + sway;
        const endY = topY + wiltSag;

        const steps = 14;
        ctx.font = `${Math.max(10, Math.floor(cellH * 0.85))}px monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const inv = 1 - t;
          const x = inv * inv * baseX + 2 * inv * t * midX + t * t * endX;
          const y = inv * inv * baseY + 2 * inv * t * midY + t * t * endY;

          if (vitality < 0) {
            ctx.fillStyle = `rgba(112, 118, 82, ${Math.max(0.22, 0.68 + vitality * 0.4)})`;
          } else {
            ctx.fillStyle = `rgba(92, 205, 128, ${Math.min(0.95, 0.45 + 0.5 * Math.max(0, vitality))})`;
          }
          ctx.fillText(t > 0.7 ? "/" : "|", x, y);

          if (i === 5 || i === 9) {
            const dir = (i + Math.floor(phase)) % 2 === 0 ? 1 : -1;
            const leafDrop = Math.max(0, -vitality) * 14;
            ctx.fillStyle = vitality < 0 ? "rgba(125, 122, 78, 0.5)" : "rgba(122, 226, 152, 0.85)";
            ctx.fillText(dir > 0 ? "\\~" : "~/ ", x + dir * 12, y + leafDrop);
          }
        }
      }

      function drawWaterDropAndRipple(now, localSec) {
        if (!dropAnim.active) return;

        const impactDelay = 1.1;
        const tx = width * dropAnim.targetX;
        const ty = height * dropAnim.targetY;

        ctx.font = `bold ${Math.max(14, Math.floor(cellH * 1.15))}px monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        if (localSec < impactDelay) {
          const p = localSec / impactDelay;
          const startY = height * 0.12;
          const curY = startY + (ty - startY) * (p * p);
          const wobble = Math.sin(now * 0.02) * 3;
          ctx.fillStyle = "rgba(120, 215, 255, 0.95)";
          ctx.fillText("💧", tx + wobble, curY);
          ctx.fillStyle = "rgba(155, 230, 255, 0.75)";
          ctx.fillText("|", tx + wobble, curY - cellH);
        } else {
          const after = localSec - impactDelay;
          if (after < 3.2) {
            const alpha = Math.max(0, 1 - after / 3.2);
            const r1 = after * 75;
            const r2 = Math.max(0, (after - 0.35) * 65);

            ctx.save();
            ctx.strokeStyle = `rgba(125, 220, 255, ${alpha * 0.75})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(tx, ty + 18, r1, r1 * 0.28, 0, 0, Math.PI * 2);
            ctx.stroke();

            if (r2 > 0) {
              ctx.strokeStyle = `rgba(180, 240, 255, ${alpha * 0.5})`;
              ctx.beginPath();
              ctx.ellipse(tx, ty + 18, r2, r2 * 0.28, 0, 0, Math.PI * 2);
              ctx.stroke();
            }

            // Sparkle droplets rising slightly on revival
            ctx.fillStyle = `rgba(150, 232, 255, ${alpha})`;
            ctx.fillText("✦", tx - after * 26, ty - after * 18);
            ctx.fillText("✦", tx + after * 28, ty - after * 22);
            ctx.restore();
          }
        }
      }

      function drawBackgroundParticles(now, dt, showHearts, showFireflies, vitality) {
        if (showHearts) {
          ctx.font = `${Math.max(12, Math.floor(cellH * 0.95))}px monospace`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          for (const h of hearts) {
            h.y -= h.speed * dt;
            h.phase += dt * 1.6;
            if (h.y < -0.06) {
              h.y = 1.05;
              h.x = Math.random();
            }
            const hx = (h.x + Math.sin(h.phase + h.drift) * h.amp) * width;
            const hy = h.y * height;
            ctx.fillStyle = h.color;
            ctx.fillText(h.char, hx, hy);
          }
        }

        if (showFireflies) {
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          for (const f of fireflies) {
            f.x += f.vx * dt + Math.sin(now * 0.0012 + f.phase) * 0.008 * dt;
            f.y += f.vy * dt + Math.cos(now * 0.0015 + f.phase) * 0.008 * dt;
            if (f.x < 0.02) f.x = 0.98;
            if (f.x > 0.98) f.x = 0.02;
            if (f.y < 0.12) f.y = 0.85;
            if (f.y > 0.88) f.y = 0.14;

            const pulse = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(now * 0.004 * f.freq + f.phase));
            const fx = f.x * width;
            const fy = f.y * height;

            ctx.font = `${Math.max(11, Math.floor(cellH * (0.8 + pulse * 0.35)))}px monospace`;
            ctx.fillStyle = `rgba(255, 236, 130, ${pulse})`;
            ctx.fillText(f.glyph, fx, fy);
          }
        }
      }

      function drawTextOverlay(lines, alpha, yStartRatio) {
        if (alpha <= 0.02 || !lines || !lines.length) return;

        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
        const fontSize = Math.max(12, Math.min(16, Math.floor(width / 68)));
        ctx.font = `${fontSize}px monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";

        const maxTextWidth = Math.min(width * 0.84, 780);
        const wrappedLines = [];

        for (const rawLine of lines) {
          const words = rawLine.split(" ");
          let current = "";
          for (const word of words) {
            const test = current ? `${current} ${word}` : word;
            if (ctx.measureText(test).width <= maxTextWidth) {
              current = test;
            } else {
              if (current) wrappedLines.push(current);
              current = word;
            }
          }
          if (current) wrappedLines.push(current);
          wrappedLines.push("");
        }
        if (wrappedLines.length && wrappedLines[wrappedLines.length - 1] === "") {
          wrappedLines.pop();
        }

        const lineHeight = fontSize * 1.55;
        const boxHeight = wrappedLines.length * lineHeight + 24;
        const startY = Math.max(46, height * yStartRatio);

        ctx.fillStyle = "rgba(7, 10, 20, 0.68)";
        ctx.strokeStyle = "rgba(244, 236, 208, 0.16)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(
          (width - Math.min(width * 0.9, maxTextWidth + 44)) * 0.5,
          startY - 12,
          Math.min(width * 0.9, maxTextWidth + 44),
          boxHeight,
          12
        );
        ctx.fill();
        ctx.stroke();

        wrappedLines.forEach((line, idx) => {
          if (!line) return;
          const isSignature = line.includes("Sincerely yours, Brandow");
          ctx.fillStyle = isSignature ? "#ffd3e2" : "#f4ecd0";
          ctx.fillText(line, width * 0.5, startY + idx * lineHeight);
        });

        ctx.restore();
      }

      let lastFrame = performance.now();

      function render(now) {
        const rawDt = Math.min(0.08, (now - lastFrame) / 1000);
        lastFrame = now;
        const dt = paused ? 0 : rawDt;

        if (!paused) {
          const localSec = (now - sceneStart - pauseAccum) / 1000;
          const totalSec = Math.min(180, (now - totalStart - pauseAccum) / 1000);
          const mins = Math.floor(totalSec / 60);
          const secs = Math.floor(totalSec % 60);
          clockLabel.textContent = `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")} / 03:00`;

          // Clear frame with subtle trail
          ctx.fillStyle = "rgba(7, 10, 20, 0.34)";
          ctx.fillRect(0, 0, width, height);

          const vitality = getVitality(sceneIndex, localSec, now);
          const sway = Math.sin(now * 0.0014) * 5;

          const showHearts = sceneIndex === 3 || sceneIndex === 4;
          const showFireflies = sceneIndex === 3 || sceneIndex === 4;
          drawBackgroundParticles(now, dt, showHearts, showFireflies, vitality);

          // Determine bouquet vs field layout
          if (sceneIndex === 3 || sceneIndex === 4) {
            // Field of lilies across lower/mid canvas
            const fieldProgress = sceneIndex === 3 ? Math.min(1, localSec / 3.5) : 1;
            const lilyCount = Math.max(7, Math.min(15, Math.floor(cols / 9)));
            const baseGroundY = height * 0.92;

            for (let i = 0; i < lilyCount; i++) {
              const frac = lilyCount === 1 ? 0.5 : i / (lilyCount - 1);
              const stagger = Math.max(0, Math.min(1, (fieldProgress - frac * 0.35) / 0.65));
              if (stagger <= 0 && sceneIndex === 3) continue;

              const rowDepth = i % 2 === 0 ? 0.0 : -0.05;
              const bx = width * (0.08 + frac * 0.84);
              const by = baseGroundY + height * rowDepth;
              const stemHeight = (height * (0.24 + (i % 3) * 0.045)) * (0.35 + 0.65 * stagger);
              const tx = bx + (frac - 0.5) * 18;
              const ty = by - stemHeight;

              const localSway = sway * (0.7 + (i % 4) * 0.2) + Math.cos(now * 0.0011 + i) * 3;
              drawStemAndLeaves(bx, by, tx, ty, vitality, localSway, i);
              drawLilyHead(
                tx + localSway,
                ty,
                Math.max(16, Math.min(28, width * 0.022)),
                stagger,
                0,
                vitality,
                i,
                localSway,
                i * 7 + now * 0.0015
              );
            }
          } else {
            // Signature bouquet cluster
            const bouquetBaseX = width * 0.5;
            const bouquetBaseY = height * 0.9;
            const stems = [
              { dx: -48, topDx: -72, hRatio: 0.29, headR: 24, phase: 0.2 },
              { dx: -24, topDx: -36, hRatio: 0.35, headR: 28, phase: 1.1 },
              { dx: 0,    topDx: 0,   hRatio: 0.39, headR: 31, phase: 2.0 },
              { dx: 24,   topDx: 36,  hRatio: 0.35, headR: 28, phase: 2.9 },
              { dx: 48,   topDx: 72,  hRatio: 0.29, headR: 24, phase: 3.8 }
            ];

            stems.forEach((s, idx) => {
              const bx = bouquetBaseX + s.dx;
              const by = bouquetBaseY;
              const tx = bouquetBaseX + s.topDx;
              const ty = bouquetBaseY - height * s.hRatio;
              const localSway = sway * (0.8 + idx * 0.12);
              const openAmt = sceneIndex === 0 ? Math.min(1, localSec / 2.4) : 1;

              drawStemAndLeaves(bx, by, tx, ty, vitality, localSway, s.phase);
              drawLilyHead(
                tx + localSway,
                ty,
                s.headR,
                openAmt,
                0,
                vitality,
                idx,
                localSway,
                idx * 5 + now * 0.0015
              );
            });
          }

          if (sceneIndex === 2) {
            drawWaterDropAndRipple(now, localSec);
          }

          // Text overlays per scene
          if (sceneIndex === 0) {
            const a = Math.min(1, Math.max(0, (localSec - 0.8) / 1.5));
            drawTextOverlay(
              ["For Emy — Lily Bouquet", "Click the screen when you're ready to see the next part."],
              a,
              0.12
            );
          } else if (sceneIndex === 1) {
            // Previous text vanishes first (0s-1.2s), then health message fades in (2.2s+)
            const healthAlpha = Math.min(1, Math.max(0, (localSec - 2.2) / 1.8));
            drawTextOverlay(TEXT_HEALTH, healthAlpha, 0.11);
          } else if (sceneIndex === 2) {
            const dropTextAlpha = Math.min(1, Math.max(0, (localSec - 1.3) / 1.8));
            drawTextOverlay(TEXT_DROP, dropTextAlpha, 0.11);
          } else if (sceneIndex === 3 || sceneIndex === 4) {
            const fieldAlpha = sceneIndex === 3 ? Math.min(1, Math.max(0, (localSec - 1.2) / 1.8)) : 1;
            drawTextOverlay(TEXT_FIELD, fieldAlpha, 0.10);
          }
        }

        requestAnimationFrame(render);
      }

      window.addEventListener("resize", resize);
      canvas.addEventListener("pointerdown", () => {
        if (!paused) advanceScene();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") {
          setScene(sceneIndex + 1);
        } else if (e.key === "ArrowLeft") {
          setScene(sceneIndex - 1);
        } else if (e.code === "Space") {
          e.preventDefault();
          paused = !paused;
          if (paused) {
            pauseStartedAt = performance.now();
            hintText.textContent = "Paused · Press Space to resume";
          } else {
            pauseAccum += performance.now() - pauseStartedAt;
            hintText.textContent = SCENES[sceneIndex].hint;
          }
        }
      });

      resize();
      setScene(0);
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
